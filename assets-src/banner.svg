<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
	<title>Codo Mailer</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#143947"/>
			<stop offset="1" stop-color="#025373"/>
		</linearGradient>
	</defs>
	<rect width="1544" height="500" fill="url(#bg)"/>

	<!-- Quiet route lines: mail leaving the site -->
	<g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
		<path d="M-20 430 C 300 380, 520 470, 860 400 S 1350 300, 1580 340"/>
		<path d="M-20 470 C 340 430, 560 500, 900 440 S 1380 350, 1580 390"/>
		<path d="M-20 70 C 320 120, 640 30, 980 90 S 1400 160, 1580 110"/>
	</g>
	<path d="M1170 262 C 1270 262, 1320 176, 1440 172" fill="none" stroke="#F29472" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
	<circle cx="1452" cy="170" r="9" fill="#F29472"/>

	<!-- Icon -->
	<g transform="translate(130 110) scale(1.09375)">
		<rect width="256" height="256" rx="56" fill="#ffffff" fill-opacity="0.08"/>
		<rect x="40" y="66" width="164" height="118" rx="14" fill="#ffffff"/>
		<path d="M50 78 L122 132 L194 78" fill="none" stroke="#025373" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="190" cy="180" r="42" fill="#F29472" stroke="#0b4560" stroke-width="10"/>
		<path d="M171 181 L185 195 L210 168" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<!-- Wordmark and promise -->
	<text x="470" y="238" font-family="Inter Display, Inter, sans-serif" font-weight="700" font-size="112" fill="#ffffff" letter-spacing="-2">Codo Mailer</text>
	<text x="474" y="306" font-family="Inter, sans-serif" font-size="40" fill="#d9e5e8">WordPress email that arrives. Secure by default.</text>
	<rect x="474" y="342" width="56" height="5" rx="2.5" fill="#F29472"/>
	<text x="474" y="392" font-family="Inter, sans-serif" font-size="28" fill="#9fbfca">Free  ·  No upsells  ·  From Codo Digital</text>
</svg>
